<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Vertical slider track 1 -->
  <line x1="12" y1="8" x2="12" y2="40" stroke="#c4aee0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Vertical slider track 2 -->
  <line x1="24" y1="8" x2="24" y2="40" stroke="#c4aee0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Vertical slider track 3 -->
  <line x1="36" y1="8" x2="36" y2="40" stroke="#c4aee0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Handle 1 (low position) -->
  <circle cx="12" cy="30" r="5" fill="rgba(167,139,202,0.25)" stroke="#c4aee0" stroke-width="2.5"/>
  <!-- Handle 2 (mid position) -->
  <circle cx="24" cy="18" r="5" fill="rgba(167,139,202,0.25)" stroke="#c4aee0" stroke-width="2.5"/>
  <!-- Handle 3 (high-mid position) -->
  <circle cx="36" cy="26" r="5" fill="rgba(167,139,202,0.25)" stroke="#c4aee0" stroke-width="2.5"/>
</svg>
